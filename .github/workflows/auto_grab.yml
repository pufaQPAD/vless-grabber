name: Auto VLESS Grabber

on:
  schedule:
    - cron: '0 * * * *' # Запуск ровно в начале каждого часа круглые сутки
  workflow_dispatch: # Оставляет кнопку для ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Скачиваем полную историю, чтобы избежать конфликтов git

      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Запуск грабера
        run: python grabber.py

      - name: Публикация результатов в твой GitHub
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
          # Защита: подтягиваем изменения из облака, если ты что-то правил руками
          git pull --rebase origin main
          
          git add vless_proxies.txt sub.txt
          
          # Фиксируем изменения, если они есть
          git commit -m "📊 Авто-обновление прокси баз" || exit 0
          
          # Принудительно отправляем в ветку main
          git push origin main
