name: Auto VLESS Grabber

on:
  schedule:
    - cron: '0 * * * *' # Запуск ровно в начале каждого часа круглые сутки
  workflow_dispatch: # Оставляет кнопку для ручного запуска

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v3

      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Запуск грабера
        run: python grabber.py

      - name: Автоматический коммит результатов в репозиторий
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "📊 Авто-обновление прокси баз"
          file_pattern: 'vless_proxies.txt sub.txt'
          commit_user_name: "GitHub Actions"
          commit_user_email: "actions@github.com"
